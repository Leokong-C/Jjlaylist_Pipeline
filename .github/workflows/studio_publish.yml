name: Studio Release Publish (J_Jlaylist)

# 준비된 릴리스(음원 + 커버 + plan.json)를 렌더하고 @J_Jlaylist 채널에 예약 업로드
# - studio/releases/** 를 push하면 즉시 실행
# - 매일 1회 실행: 하루 한도(6개)로 못 올린 쇼츠를 이어서 업로드
on:
  push:
    branches: [main]
    paths:
      - 'studio/releases/**'
  schedule:
    - cron: '23 4 * * *'      # 매일 13:23 KST
  workflow_dispatch:
    inputs:
      slug:
        description: '특정 릴리스만 (비우면 전체)'
        required: false
        default: ''
      dry_run:
        description: 'dry-run (업로드 안 함)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: studio-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg + Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk

      - name: Install Python deps
        run: pip install -r studio/requirements.txt

      - name: Render + publish
        id: run
        working-directory: studio
        env:
          TOKEN_PICKLE_B64: ${{ secrets.TOKEN_PICKLE_B64 }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.slug }}" ]; then ARGS="$ARGS --slug ${{ github.event.inputs.slug }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python autopublish.py $ARGS 2>&1 | tee publish.log
          exit ${PIPESTATUS[0]}

      - name: Commit upload log (plan.json)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add studio/releases/*/plan.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(studio): upload log $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase && git push
          fi

      - name: Result
        if: always()
        id: res
        run: |
          R=$(grep '::RESULT::' studio/publish.log | tail -1 | sed 's/::RESULT:://')
          echo "result=${R:-FAIL}" >> $GITHUB_OUTPUT

      - name: Email
        if: always() && steps.res.outputs.result != 'NOTHING_TO_DO'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[J_Jlaylist Studio] 업로드 결과 - ${{ steps.res.outputs.result }}"
          to: ${{ secrets.MAIL_TO }}
          from: J_Jlaylist Studio <${{ secrets.MAIL_USERNAME }}>
          body: |
            결과: ${{ steps.res.outputs.result }}
            모든 영상은 '비공개 + 예약 공개' 상태로 올라갑니다. 공개 전 YouTube Studio에서 확인하세요.
            로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: studio/publish.log
