name: Weekly Channel Analyzer

on:
  schedule:
    # 매주 일요일 09:00 KST = 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: write
  issues: write       # GitHub Issue 자동 생성 위해 필요

jobs:
  weekly-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install anthropic google-auth google-auth-oauthlib google-api-python-client

      - name: Run weekly analyzer
        id: analyzer
        env:
          TOKEN_PICKLE_B64: ${{ secrets.TOKEN_PICKLE_B64 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python analyzer.py --apply --auto 2>&1 | tee analyzer_output.log
          PYTHON_EXIT=${PIPESTATUS[0]}
          if [ "$PYTHON_EXIT" != "0" ]; then
            exit 1
          fi

      - name: Extract report metadata
        if: always()
        id: report
        run: |
          # 가장 최근 weekly_report HTML 찾기
          REPORT_HTML=$(ls -t weekly_reports/weekly_report_*.html 2>/dev/null | head -1 || echo "")
          REPORT_JSON=$(ls -t weekly_reports/weekly_summary_*.json 2>/dev/null | head -1 || echo "")
          echo "report_html=$REPORT_HTML" >> $GITHUB_OUTPUT
          echo "report_json=$REPORT_JSON" >> $GITHUB_OUTPUT
          # 발견된 기회 수 추출
          RESULT=$(grep '::RESULT::' analyzer_output.log | tail -1 | sed 's/::RESULT:://')
          echo "result=$RESULT" >> $GITHUB_OUTPUT

      - name: Commit reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly_reports/ analyzer_history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: weekly analysis $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Send weekly report email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "📊 [J_Jlaylist] 주간 분석 보고 - ${{ steps.report.outputs.result }}"
          to: ${{ secrets.MAIL_TO }}
          from: J_Jlaylist Analyzer <${{ secrets.MAIL_USERNAME }}>
          html_body: file://${{ steps.report.outputs.report_html }}
          attachments: ${{ steps.report.outputs.report_json }},analyzer_output.log